# Nom du service dans Eureka (sans espace)
spring.application.name=ms2-quiz

# ===== MS2 - Quiz & Evaluations =====
server.port=8082

# ----- Eureka (Service Discovery) -----
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
# Eureka utilise l'etat reel de l'application (base de donnees comprise) via Actuator
eureka.client.healthcheck.enabled=true
eureka.instance.status-page-url-path=/actuator/info
eureka.instance.health-check-url-path=/actuator/health
# Evite la boucle : le statut "distant" vu par Eureka ne doit pas entrer dans la sante de MS2
# (sinon DOWN au demarrage -> envoye a Eureka -> reste DOWN pour toujours)
spring.cloud.discovery.client.composite-indicator.enabled=false

# ----- Actuator -----
# Endpoints exposes : http://localhost:8082/actuator
management.endpoints.web.exposure.include=health,info,metrics,env,beans,mappings
management.endpoint.health.show-details=always
management.info.env.enabled=true
management.info.java.enabled=true
info.app.name=MS2 - Quiz & Evaluations
info.app.description=Creation de quiz, correction automatique, notes et historique
info.app.version=1.0.0
info.app.responsable=Mohamed Aziz Latrache

# ----- MySQL (XAMPP / WAMP : root sans mot de passe) -----
spring.datasource.url=jdbc:mysql://localhost:3306/ms2_quiz_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=

# ----- JPA / Hibernate -----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ----- Swagger (springdoc) -----
# UI      : http://localhost:8082/swagger-ui.html
# OpenAPI : http://localhost:8082/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.display-request-duration=true

# ----- Donnees de demo (quiz Francais - Grammaire) -----
app.seed.enabled=true
