
# ======================================
# APPLICATION MS1 - COURS ET RESSOURCES
# ======================================
spring.application.name=ms1-cours-ressources
server.port=8081

# ======================================
# MYSQL
# ======================================
spring.datasource.url=jdbc:mysql://localhost:3306/edukids_ms1
spring.datasource.username=root
spring.datasource.password=

# ======================================
# JPA / HIBERNATE
# ======================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ======================================
# EUREKA CLIENT
# ======================================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.healthcheck.enabled=true

# ======================================
# SPRING BOOT ACTUATOR
# ======================================
management.endpoints.web.exposure.include=health,info,metrics,loggers
management.endpoint.health.show-details=always

# ======================================
# CORRECTION EUREKA / ACTUATOR HEALTH
# ======================================
# Eviter la boucle de sante entre Eureka et Actuator
management.health.eureka.enabled=false
spring.cloud.discovery.client.composite-indicator.enabled=false
spring.cloud.discovery.client.health-indicator.enabled=false

# Conserver la surveillance de la base MySQL
management.health.db.enabled=true

# ======================================
# INFORMATIONS ACTUATOR
# ======================================
management.info.env.enabled=true

info.app.name=MS1-Cours-Ressources
info.app.version=1.0.0
info.app.description=Microservice de gestion des cours et ressources EduKids AI
